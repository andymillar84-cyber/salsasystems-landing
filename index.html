<html lang="en" data-theme="light" data-style="bold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="Salsa Systems builds AI tools for allied health clinics — less admin, more patients. Book a free discovery call.">
<meta name="keywords" content="Salsa Systems, AI allied health, clinic AI, allied health software, clinic automation, Andrew Millar">

<meta property="og:title" content="Salsa Systems — AI for Allied Health Clinics">

<meta property="og:url" content="https://salsasystems.com.au/">
<meta property="og:type" content="website">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "Salsa Systems",
  "url": "https://salsasystems.com.au",
  "description": "AI tools for allied health clinics — less admin, more patients.",
  "areaServed": "AU",
  "founder": "Andrew Millar"
}

<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="styles.css?v=7">
<link rel="stylesheet" href="bold.css?v=5">
<link rel="stylesheet" href="shapes.css?v=1">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components/LogoMark.jsx"></script>
<script type="text/babel" src="components/Shapes.jsx"></script>
<script type="text/babel" src="components/Nav.jsx"></script>
<script type="text/babel" src="components/Hero.jsx"></script>
<script type="text/babel" src="components/Who.jsx"></script>
<script type="text/babel" src="components/CurrentClient.jsx"></script>
<script type="text/babel" src="components/Closing.jsx"></script>
<script src="https://assets.calendly.com/assets/external/widget.js" async></script>
<link rel="stylesheet" href="https://assets.calendly.com/assets/external/widget.css">
<script src="reveal.js"></script>

<script type="text/babel">
  const App = () => {
    const [theme, setThemeState] = React.useState('light');

    const setTheme = (t) => {
      setThemeState(t);
      document.documentElement.setAttribute('data-theme', t);
    };

    const openBooking = React.useCallback(() => {
      if (window.Calendly && window.Calendly.initPopupWidget) {
        window.Calendly.initPopupWidget({
          url: 'https://calendly.com/andrew-salsasystems/30min',
          pageSettings: {
            hideEventTypeDetails: false,
            hideLandingPageDetails: false,
            hideGdprBanner: true,
            backgroundColor: theme === 'dark' ? '0E0C09' : 'FBFBF2',
            textColor: theme === 'dark' ? 'F0EEE4' : '222222',
            primaryColor: 'D66853',
          },
        });
      } else {
        window.open('https://calendly.com/andrew-salsasystems/30min', '_blank', 'noopener');
      }
    }, [theme]);

    return (
      <div className="shell">
        <SalsaNav onBook={openBooking} theme={theme} setTheme={setTheme} logoOutline="thick-dark" />
        <SalsaHero onBook={openBooking} headline={"Less admin.\nMore patients."} ctaLabel="Steal 20 minutes of our time" />
        <SalsaWho onBook={openBooking} />
        <SalsaCurrentClient onBook={openBooking} />
        <SalsaClosing onBook={openBooking} />
        <SalsaFooter logoOutline="thick-dark" />
      </div>
    );
  };

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
